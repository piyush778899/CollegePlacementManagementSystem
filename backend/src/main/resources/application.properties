server.port=8080

# ========================
# MySQL Database
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/college_placement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Piyush@77
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
